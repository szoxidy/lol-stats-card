<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>英雄联盟个人卡片</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="page-header">
      <div class="brand"><svg viewBox="0 0 40 48" aria-hidden="true"><path d="M20 3 35 23 20 44 5 23Z"/><path d="M20 12 28 23 20 35 12 23Z"/></svg><span>英雄联盟个人卡片</span></div>
      <span class="local-label">本地预览</span>
    </header>
    <section class="intro">
      <h1>个人战绩卡片</h1>
      <p>标准资料卡与 Mini 签名卡。</p>
    </section>
    <section class="workspace" aria-label="卡片预览与设置">
      <div class="preview-panel">
        <div class="preview-title"><h2>卡片预览</h2><span id="source-label">正在读取资料</span></div>
        <div class="card-stage"><img id="card" alt="英雄联盟个人卡片预览" width="550" height="320"></div>
        <div class="preview-footer"><span id="dimensions">550 × 320</span><span id="motion-label">轻动效</span></div>
      </div>
      <aside class="settings" aria-label="卡片设置">
        <div class="player"><span>当前账号</span><strong id="player-name">正在读取</strong><small id="player-region"></small></div>
        <div class="setting-field"><label for="layout">卡片尺寸</label>
        <select id="layout"><option value="wide">标准卡片</option><option value="compact">Mini 卡片</option></select></div>
        <div class="setting-field"><label for="background">英雄背景</label>
        <select id="background"><option value="miss-fortune">武装战姬 · 厄运小姐</option><option value="ahri">阿狸</option><option value="yasuo">亚索</option><option value="jinx">金克丝</option></select></div>
        <div class="setting-field"><label for="queue">战绩模式</label>
        <select id="queue"><option value="all">全部模式</option><option value="solo">单双排</option><option value="flex">灵活排位</option><option value="ranked">排位模式</option><option value="hextech">海克斯大乱斗</option><option value="aram">极地大乱斗</option><option value="normal">匹配模式</option></select></div>
        <div class="setting-field"><label for="motion">动态效果</label>
        <select id="motion"><option value="subtle">轻动效</option><option value="frames">逐帧光效</option><option value="static">静态</option></select></div>
        <fieldset><legend>卡片配色</legend><div class="theme-options"><button type="button" data-theme="dark" aria-pressed="true"><span class="swatch dark"></span>深色</button><button type="button" data-theme="light" aria-pressed="false"><span class="swatch light"></span>浅色</button></div></fieldset>
        <div class="refresh-group">
        <button type="button" class="sync-button" id="refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.5 6.5A7.5 7.5 0 0 1 19 10M5 14a7.5 7.5 0 0 0 12.5 3.5"/></svg><span>刷新预览</span></button>
        <p class="sync-note">远程数据来源待接入。</p>
        </div>
      </aside>
    </section>
    <div class="status" id="status" role="status" aria-live="polite">正在读取本地资料…</div>
    <section class="sharing" aria-label="保存与引用卡片">
      <div><h2>把卡片带走</h2><p>保存图片，或使用固定图片地址。</p></div>
      <div class="actions"><button type="button" id="copy">复制本地图片地址</button><a id="download" download="lol-card.svg">下载 SVG</a></div>
    </section>
    <div class="embed"><code id="embed-code"></code></div>
    <p class="address-note">当前地址仅本机可用。部署后，博客才能通过固定链接读取最新卡片。</p>
    <footer><span>个人展示原型</span><span>与 Riot Games、腾讯无隶属关系。</span></footer>
  </main>
</body>
</html>
